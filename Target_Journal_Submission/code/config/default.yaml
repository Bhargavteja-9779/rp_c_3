# Documentation of the configuration used for the reported study. run_all.py encodes the
# same values (the YAML is the human-readable record; changing it does not change the run).
data:
  archive: UCR 2018 univariate (equal length, no missing values) -> 114 datasets
  resamples: [0, 1, 2, 3, 4]          # 0 = official split; r>0 stratified, numpy seed r
features:
  main: MiniRocket (aeon 1.6.0, 9,996 features, random_state = 1000*r + j)
  generalisation: [Rocket (5,000 kernels -> 10,000 features), MultiRocket, Hydra]
ridge:
  lambdas: logspace(-3, 3, 10) x n_train   # on standardised features
  standardise: train mean / std
loom:
  moderation: standard                  # p = softmax(a z / sqrt(h / h_ref)), h_ref = median LOO leverage
  pairs: exact leave-one-out
  lambda_and_temperature: minimise LOO NLL
  target_smoothing: Platt (n_k + 1)/(n_k + 2)
ensembles: 5 MiniRocket seeds (PreVal-Ens5, LOOM-Ens5)
baselines:
  holdout_ts: 80/20 stratified split, temperature by NLL
  calibrated_cv: sklearn CalibratedClassifierCV(cv=5, ensemble=False), sigmoid / isotonic
  logreg_cv: L2, C in [1e-3, 1e-2, 1e-1, 1], 3-fold CV log-loss, skipped if n_train > 2000
  arsenal: aeon Arsenal(rocket_transform="minirocket"), resample 0 only
  quant: aeon QUANTClassifier, all resamples
corruptions:
  noise: [0.1, 0.3, 0.5]
  wander: [0.25, 0.5, 1.0]
  missing: [0.1, 0.2, 0.3]
  spikes: [0.01, 0.03, 0.05]
  warp: [0.05, 0.1, 0.2]
  shift: [0.05, 0.1, 0.2]
conformal:
  alpha: 0.1                            # sensitivity: 0.05, 0.2 (clean)
  methods: [jackknife+ (closed form), jackknife, split (Holdout-TS)]
  scores: [LAC, APS]
statistics:
  unit: dataset (mean over resamples)
  pairwise: two-sided Wilcoxon signed-rank vs LOOM, Holm correction
  effect_size: matched-pairs rank-biserial correlation
  ci: percentile bootstrap (10,000) of the median paired difference
  omnibus: Friedman test, mean ranks, Nemenyi critical difference
